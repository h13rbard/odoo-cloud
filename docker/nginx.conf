events { 
    worker_connections 1024; 
}

http {
    upstream odoo {
        server web:8069; # 👈 Volvemos a poner "web", ahora sí funcionará
    }

    # 1. Redirección forzada de HTTP (80) a HTTPS (443)
    server {
        listen 80;
        server_name odoo.jgerardogm.lat;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2. Servidor Seguro HTTPS 🔒
    server {
        listen 443 ssl;
        server_name odoo.jgerardogm.lat;

        # Rutas a tus nuevos certificados Let's Encrypt
        ssl_certificate /etc/letsencrypt/live/odoo.jgerardogm.lat/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/odoo.jgerardogm.lat/privkey.pem;

        # Protocolos seguros de cifrado estándar
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Proxy reverso hacia Odoo
        location / {
            proxy_pass http://odoo;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            
            # Ajustes para cargas pesadas de datos / reportes largos de Odoo Mates
            proxy_read_timeout 720s;
            proxy_connect_timeout 720s;
            proxy_send_timeout 720s;
        }
    }
}
